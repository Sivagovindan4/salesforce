services:
  postgres:
    image: postgres:16-alpine
    container_name: scanzaa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: scanzaa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - scanzaa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scanzaa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  scanzaa-postgres-data:
